[project]
name = "st-ito"
version = "0.0.1"
description = "Style transfer with inference-time optimization"
requires-python = ">=3.12"
readme = "README.md"
authors = [
    { name = "Christian J. Steinmetz", email = "c.j.steinmetz@qmul.ac.uk" },
]
license = { text = "Apache License 2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "laion-clap>=1.1.5",
    "llvmlite>=0.44.0",
    "markupsafe==2.1.3",
    "numba>=0.61.0",
    "numpy<2.0",
    "torch==2.5.1+cu118",
    "torchaudio==2.5.1+cu118",
    "torchlibrosa",
    "pytorch-lightning",
    "pyloudnorm",
    "pedalboard",
    "wandb",
    "soundfile",
    "matplotlib",
    "scikit-learn",
    "timm",
    "transformers",
    "wav2clip",
    "resampy",
    "cma",
    "auraloss",
    "umap-learn",
    "dasp-pytorch",
]

[project.urls]
Homepage = "https://github.com/csteinmetz1/st-ito"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu118" },
]
torchaudio = [
  { index = "pytorch-cu118" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"